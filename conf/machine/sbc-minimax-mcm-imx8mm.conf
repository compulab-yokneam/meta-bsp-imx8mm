#@TYPE: Machine
#@NAME: CompuLab SBC-MINIMAX MCM-iMX8MM
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for the CompuLab SBC-MINIMAX carrier with MCM-iMX8M-Mini
#@MAINTAINER: compulab@compulab.co.il

require compulab-imx8mm.inc

MACHINEOVERRIDES =. "mcm-imx8m-mini:"

KERNEL_DEVICETREE = "compulab/sbc-mcm-imx8m-mini-minimax.dtb "

PREFERRED_VERSION_linux-compulab = "6.6.3"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "sbc-minimax-mcm-imx8mm_defconfig,sdcard"
UBOOT_CONFIG[mfgtool] = "sbc-minimax-mcm-imx8mm_defconfig"
UBOOT_MACHINE_CONFIG = "mcm-imx8m-mini.config"

# Set u-boot DTB
UBOOT_DTB_NAME = "mcm-imx8m-mini.dtb"

# For the NXP IW612 WiFi/BT module
MACHINE_FIRMWARE:append = " firmware-nxp-wifi-nxpiw612-sdio "
PREFERRED_RPROVIDER_linux-firmware-nxpiw612-sdio = "firmware-nxp-wifi"
MACHINE_EXTRA_RRECOMMENDS:append = " nxp-wlan-sdk kernel-module-nxp-wlan btnxpuart-start "

CL_RELEASE = '0.1'
